name: quality-gates

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: enterprise_agent_test
          POSTGRES_USER: enterprise
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterprise -d enterprise_agent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://enterprise:ci_postgres_password@localhost:5432/enterprise_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check app tests run.py migrations/env.py
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_DB: enterprise_agent
      POSTGRES_USER: enterprise
      POSTGRES_PASSWORD: ci_docker_postgres_password
      JWT_SECRET: ci-docker-jwt-secret-with-more-than-32-bytes
      CORS_ORIGINS: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Wait for the application
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/health/ready
      - name: Verify frontend
        run: curl --fail --retry 10 --retry-delay 2 http://localhost:8080/
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down -v
