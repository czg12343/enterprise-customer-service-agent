[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

[tool.pytest.ini_options]
# The suite does not use pytest's cross-run cache. Disabling it also prevents
# session shutdown from hanging when a workspace contains a read-only cache.
addopts = "-p no:cacheprovider"
